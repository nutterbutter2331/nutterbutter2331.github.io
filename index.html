
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutterButter's Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    nav {
      padding: 20px 8%;
      background: #111827;
      border-bottom: 1px solid #334155;
    }

    nav a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at top,
          #1e3a8a,
          transparent 65%
        );
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin-bottom: 12px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    button {
      margin-top: 20px;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <nav>
    <a href="/">NutterButter</a>
  </nav>

  <main>
    <h1>Welcome!</h1>
    <p>
      This is my custom website hosted on GitHub Pages.
      <br>
      Built with HTML, CSS, and JavaScript.
    </p>

    <button onclick="sayHello()">
      Click Me
    </button>
  </main>

  <script>
    function sayHello() {
      alert("Hello from NutterButter's website!");
    }
  </script>
</body>
</html>
